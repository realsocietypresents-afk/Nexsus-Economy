# NexusEconomy configuration

economy:
  # balance a brand-new player starts with
  starting-balance: 0.0
  # decimal places shown/kept -- Vault plugins query this via fractionalDigits()
  fractional-digits: 2
  currency-singular: "Dollar"
  currency-plural: "Dollars"

# Physical cash: withdraw part of your bank balance as real, tradeable items in
# these denominations, and deposit them back later. Amounts are broken down
# greedily from largest to smallest denomination.
cash:
  denominations: [100, 50, 20, 10, 5, 1]

shop:
  # Every dollar a player spends buying something off the shop -- the main /shop menu, Custom/
  # Enchantments/NexusEnchants/Accessories/Potions, the Hearts/Hunger/Oxygen upgrades, Accessory
  # Slots, and the credit-card shop -- is deposited into this player's account instead of just
  # being withdrawn and vanishing. Selling TO the shop is untouched; that's the shop paying the
  # player, not a purchase. Set by player name -- looked up once (and cached) the first time a
  # sale happens, so it needs to be someone who has already joined this server at least once.
  revenue-recipient: "RealSociety5107"
  # multiplies every price in shop-items.yml -- lets you retune the whole
  # shop up or down at once without hand-editing every entry. 1.0 = no change.
  sell-price-multiplier: 1.0
  buy-price-multiplier: 1.0

  # The shop's whole pricing model. Every priced item -- hand-curated
  # (via "tier:" in shop-items.yml) or auto-generated -- draws its buy
  # and sell price from exactly one of these seven tiers, so retuning a
  # tier here re-prices every item that uses it at once.
  #
  # Tiers are meant to track how many real steps it takes to get an item
  # -- SCRAP is stuff lying on the ground or one furnace away, MYTHIC is
  # the hardest things in the game to obtain (deep dark farms, one-per-
  # world blocks). Two anchor points set the scale: a netherite block
  # (ancient debris mining + smelting + a gold-ingot smithing combine,
  # nine times over) sits at the top of EXOTIC, and a sculk shrieker
  # (a whole deep dark / sculk catalyst farm) sits at the top of MYTHIC.
  #
  # Sell is deliberately generous going up the ladder -- that's the
  # actual payout for going and doing the hard thing. Buy is priced well
  # above sell on every tier, and the gap widens at the top -- buying
  # your way to end-game gear instead of earning it should cost real
  # money, and the rarer the tier the bigger that premium gets.
  pricing-tiers:
    SCRAP:    { buy: 100,    sell: 20 }     # dirt, cobblestone, raw crops -- free for the taking
    COMMON:   { buy: 450,    sell: 75 }     # one craft/smelt step: planks, glass, wool
    STANDARD: { buy: 2100,   sell: 300 }    # a few real steps: bricks, stone bricks, iron gear
    REFINED:  { buy: 7200,   sell: 900 }    # meaningful ore investment: iron/gold blocks, hoppers
    PRECIOUS: { buy: 19800,  sell: 2200 }   # real rarity: diamonds, emeralds, enchanting tables
    EXOTIC:   { buy: 50000,  sell: 5000 }   # nether-tier grind: netherite, tridents, ender chests
    MYTHIC:   { buy: 120000, sell: 10000 }  # the hardest gets in the game: sculk shriekers, dragon eggs

  # Automatically adds every remaining placeable block in the game, sorted
  # into focused tabs such as Glass, Carpets, Tree Products, Flowers, Plants,
  # Wood, Doors & Trapdoors, Fences & Walls, Stone, masonry, Redstone,
  # Lighting, Storage, Workstations, Nether, End, and Terrain -- on top of whatever's
  # hand-listed in shop-items.yml. A block already listed by hand anywhere
  # in shop-items.yml is skipped here, so curated categories keep their
  # own tuned prices and nothing gets listed twice. The sorting is a
  # best-effort heuristic, not a perfect ontology -- use
  # category-overrides below to pin anything that lands in the wrong tab.
  auto-blocks:
    enabled: true

    # Blocks withheld from the auto-catalog entirely. Respawn anchors and
    # TNT are here because they're explosive/griefing tools. The rest are
    # creative-mode/admin-only blocks (command execution, world-editing,
    # unlimited loot/mob generation, or invisible/unbreakable blocks) that
    # would be a much bigger "ruin the server" risk than TNT if handed to
    # every player -- remove any of these you're comfortable selling, or
    # add more.
    excluded:
      - RESPAWN_ANCHOR
      - TNT
      - COMMAND_BLOCK
      - CHAIN_COMMAND_BLOCK
      - REPEATING_COMMAND_BLOCK
      - STRUCTURE_BLOCK
      - STRUCTURE_VOID
      - JIGSAW
      - BARRIER
      - LIGHT
      - SPAWNER
      - TRIAL_SPAWNER
      - VAULT
      - BEDROCK
      # Items excluded as of v5 (the item-catalog expansion) -- every one of these
      # needs extra NBT/component data (a potion effect, a book's pages, an
      # instrument, an amplifier) to mean anything; sold as a bare, data-free
      # ItemStack they'd either be useless or outright misleading. Nothing here is
      # a "too powerful" judgment call the way TNT/respawn anchors above are --
      # these are just incomplete items.
      - POTION
      - SPLASH_POTION
      - LINGERING_POTION
      - TIPPED_ARROW
      - WRITTEN_BOOK
      - WRITABLE_BOOK
      - FIREWORK_ROCKET
      - FIREWORK_STAR
      - SUSPICIOUS_STEW
      - GOAT_HORN
      - DEBUG_STICK
      - KNOWLEDGE_BOOK
      - FILLED_MAP
      - OMINOUS_BOTTLE

    # Force specific blocks into a specific tab, overriding the automatic
    # name-pattern sorting -- e.g. GLOWSTONE: Decoration to move it out of
    # Nether & End. Tab names must match an existing tab exactly (Ores,
    # Wood, Stone, Colored Blocks, Nether & End, Redstone, Farming,
    # Decoration, Blocks, Miscellaneous, or any tab name of your own from
    # shop-items.yml).
    category-overrides: {}

    # The default pricing-tiers entry for anything auto-added to a given
    # tab, when it's not called out by name in tier-overrides below.
    # Decoration defaults to SCRAP -- most of what lands there (candles,
    # chains, torches, iron bars) is genuinely trivial; the handful of
    # decoration items that actually take real effort (amethyst clusters,
    # rare mob heads) are bumped individually in tier-overrides below
    # instead of dragging the whole tab's baseline up with them.
    tab-default-tier:
      Glass: COMMON
      Carpets: SCRAP
      Wool: COMMON
      Concrete: STANDARD
      "Concrete Powder": COMMON
      Terracotta: COMMON
      "Glazed Terracotta": STANDARD
      "Tree Products": SCRAP
      Flowers: SCRAP
      Plants: SCRAP
      Mushrooms: SCRAP
      Wood: COMMON
      "Doors & Trapdoors": STANDARD
      "Fences & Walls": COMMON
      Stone: COMMON
      "Bricks & Masonry": STANDARD
      "Ores & Minerals": REFINED
      Redstone: COMMON
      Lighting: COMMON
      Storage: STANDARD
      Workstations: STANDARD
      Decoration: COMMON
      Nether: STANDARD
      End: REFINED
      Terrain: SCRAP
      Miscellaneous: COMMON
      # v5 additions -- defaults for whatever new NON-BLOCK items land in these
      # already-existing, already-hand-curated tabs (a genuinely new material like
      # a future MC version's newest weapon, or anything this build's classifier
      # didn't specifically sort). Anything already hand-listed in shop-items.yml
      # is untouched either way -- this only prices auto-added newcomers.
      Armor: STANDARD
      Tools: STANDARD
      Weapons: STANDARD
      Ranged: SCRAP
      Utility: COMMON
      "Mob Drops": COMMON
      Food: SCRAP
      Fishing: COMMON
      Brewing: STANDARD
      "Music Discs": PRECIOUS
      "Banner Patterns": SCRAP

    # Pin specific auto-added blocks to a specific tier, overriding their
    # tab's default -- for anything meaningfully rarer or more common than
    # the rest of its tab. Note: coal/iron/gold/redstone/lapis/diamond/
    # emerald/netherite blocks aren't listed here -- they're hand-priced
    # directly in shop-items.yml's Ores category instead (each is ~9x its
    # ingot/gem plus a small premium, which the flat tier system can't
    # express -- see the comment above that category for why).
    tier-overrides:
      COPPER_BLOCK: STANDARD
      RAW_COPPER_BLOCK: STANDARD
      AMETHYST_BLOCK: STANDARD
      QUARTZ_BLOCK: STANDARD
      RAW_IRON_BLOCK: REFINED
      RAW_GOLD_BLOCK: REFINED
      SCULK_CATALYST: PRECIOUS
      SCULK_SENSOR: PRECIOUS
      SPONGE: REFINED
      WET_SPONGE: STANDARD
      SCULK_SHRIEKER: MYTHIC
      DRAGON_EGG: MYTHIC
      # amethyst geode blocks -- only form naturally in geodes, worth more than a candle
      AMETHYST_CLUSTER: STANDARD
      BUDDING_AMETHYST: REFINED
      LARGE_AMETHYST_BUD: COMMON
      MEDIUM_AMETHYST_BUD: COMMON
      # mob heads -- charged-creeper-explosion drops, a real event to set up
      ZOMBIE_HEAD: COMMON
      SKELETON_SKULL: COMMON
      CREEPER_HEAD: COMMON
      PIGLIN_HEAD: COMMON
      WITHER_SKELETON_SKULL: REFINED
      PLAYER_HEAD: PRECIOUS
      DRAGON_HEAD: EXOTIC
      # portable 27-slot storage is worth far more than an ordinary block --
      # every dyed shulker box color, priced the same as the plain one
      SHULKER_BOX: EXOTIC
      WHITE_SHULKER_BOX: EXOTIC
      ORANGE_SHULKER_BOX: EXOTIC
      MAGENTA_SHULKER_BOX: EXOTIC
      LIGHT_BLUE_SHULKER_BOX: EXOTIC
      YELLOW_SHULKER_BOX: EXOTIC
      LIME_SHULKER_BOX: EXOTIC
      PINK_SHULKER_BOX: EXOTIC
      GRAY_SHULKER_BOX: EXOTIC
      LIGHT_GRAY_SHULKER_BOX: EXOTIC
      CYAN_SHULKER_BOX: EXOTIC
      PURPLE_SHULKER_BOX: EXOTIC
      BLUE_SHULKER_BOX: EXOTIC
      BROWN_SHULKER_BOX: EXOTIC
      GREEN_SHULKER_BOX: EXOTIC
      RED_SHULKER_BOX: EXOTIC
      BLACK_SHULKER_BOX: EXOTIC
      # v5 additions -- standout non-block items whose default tab tier (above)
      # would price them noticeably wrong either direction.
      IRON_NUGGET: SCRAP
      GOLD_NUGGET: SCRAP
      LEATHER_HORSE_ARMOR: COMMON
      IRON_HORSE_ARMOR: STANDARD
      GOLDEN_HORSE_ARMOR: STANDARD
      DIAMOND_HORSE_ARMOR: REFINED
      ELYTRA: EXOTIC
      TOTEM_OF_UNDYING: MYTHIC
      MACE: EXOTIC
      DRAGON_BREATH: REFINED
      ECHO_SHARD: PRECIOUS
      SHULKER_SHELL: PRECIOUS
      NAUTILUS_SHELL: PRECIOUS
      HEART_OF_THE_SEA: EXOTIC
      LAVA_BUCKET: STANDARD
      # rarer, structure/one-off-drop-exclusive discs cost more than the common ones
      MUSIC_DISC_5: EXOTIC
      MUSIC_DISC_PIGSTEP: EXOTIC
      MUSIC_DISC_OTHERSIDE: EXOTIC
      MUSIC_DISC_RELIC: EXOTIC
      MUSIC_DISC_CREATOR: EXOTIC
      MUSIC_DISC_CREATOR_MUSIC_BOX: EXOTIC
      MUSIC_DISC_PRECIPICE: EXOTIC

    # Optional exact $ pins, for the rare case a block needs a specific
    # number that doesn't cleanly match any tier. Takes priority over
    # tier-overrides and tab-default-tier above. Empty by default -- the
    # tier system above should cover nearly everything.
    price-overrides: {}

  # The Spawn Eggs tab: every *_SPAWN_EGG material the server knows about, auto-added
  # and priced by how dangerous/rare that mob actually is to deal with in survival --
  # passive farm animals are cheap, ordinary hostiles cost more, nether/structure-bound
  # mobs cost more still, and the hardest mobs in the game (the Warden, the Elder
  # Guardian) are priced at the very top of the ladder. There's no vanilla survival way
  # to obtain a spawn egg at all, so this is genuinely the only source for one -- and
  # deliberately buy-only for the same reason a sell side would just be free money.
  # Prices draw from the same shop.pricing-tiers table as everything else -- see
  # ShopManager#spawnEggTier for exactly which mob lands on which tier, and
  # tier-overrides below to move any individual mob to a different one.
  spawn-eggs:
    enabled: true
    # multiplies every spawn egg's price on top of shop.buy-price-multiplier -- lets
    # you retune spawn eggs specifically without touching the rest of the shop.
    price-multiplier: 1.0
    # When true (the default), the Spawn Eggs tab is restricted to ONLY the mobs in
    # ShopManager's SPAWN_EGG_SAFE list -- an allowlist of mobs that never attack a player
    # unprovoked (cows, villagers, iron golems, wolves, etc.), not a blocklist of
    # known-hostile ones. That's deliberate: a blocklist can only exclude mobs someone
    # remembered to add to it (the Ender Dragon was missed entirely in an earlier version of
    # this feature), while an allowlist excludes everything by default, including a mob this
    # code doesn't classify at all, or a new hostile mob a future Minecraft version adds.
    # Set to false to go back to selling every mob's egg, hostile included.
    exclude-hostile: true
    # Mobs withheld from the Spawn Eggs tab entirely -- empty by default, and rarely needed
    # now that exclude-hostile above already restricts the tab to an explicit safe list. Add
    # entries here (e.g. "- WOLF") only to additionally withhold a specific mob that IS on
    # the safe list.
    excluded: []
    # Pin a specific mob to a specific pricing-tiers entry, overriding the automatic
    # danger/rarity classification.
    tier-overrides: {}

  # The Enchantments tab: an auto-generated, max-level enchanted book for every vanilla
  # enchantment in the game, priced as genuine end-game money sinks -- deliberately far above
  # even MYTHIC-tier items above, since these are meant to still feel out of reach well after a
  # player can afford anything in the regular tabs. All buy-only (see shop-items.yml's Custom tab
  # for why NBT-bearing items generally are).
  #
  # Formula per enchantment: base-price * (its own max level ^ per-level-exponent), then
  # treasure-multiplier if it's treasure-only (Mending, Frost Walker, etc. -- meaningfully harder
  # to get any other way) and curse-multiplier if it's a curse, then a small stable per-enchant
  # variation so two enchants with the same max level don't land on an identical price. Result is
  # rounded to the nearest $100. With the defaults below: a level-1 non-treasure enchant lands
  # around $15,000-16,000, a level-5 one (Sharpness, Efficiency, Power) lands roughly $130,000-
  # $155,000, and a treasure enchant like Mending comes out around $37,000-$40,000.
  #
  # /shop addenchant <price> (holding an item) adds a genuinely custom entry on top of these
  # auto-generated books -- that's the way to add your own custom enchants (NexusEnchants' Lava
  # Walker, Tide Walker, etc.) at whatever price you want, since NexusEconomy has no way to
  # reconstruct another plugin's custom NBT on its own. Those are the ones worth pricing in the
  # millions, as actual one-of-a-kind end-game items -- the auto-generated vanilla books below are
  # meant to be merely very expensive, not that extreme.
  enchant-books:
    enabled: true
    base-price: 15000
    per-level-exponent: 1.4
    treasure-multiplier: 2.5
    curse-multiplier: 1.8

  # The Potions tab: a Potion/Splash Potion/Lingering Potion entry for every brewable effect
  # the server's API knows about (iterated live from PotionType, so a newer Minecraft version
  # adding effects is picked up automatically), plus the Bottle o' Enchanting. Unlike
  # Enchantments/NexusEnchants above, this is deliberately priced as an everyday,
  # beginner-to-mid-game purchase, not a money sink.
  #
  # Every effect is bucketed into one of three base prices for a plain drinkable Potion:
  # cheap-base-price (common utility/negative effects -- Night Vision, Invisibility, Water
  # Breathing, Slowness, Weakness, Slow Falling, Leaping), premium-base-price (the strongest
  # combat/utility effects -- Strength, Regeneration, Healing, Turtle Master, Luck), and
  # moderate-base-price for everything else (Swiftness, Fire Resistance, Poison, Harming, and
  # any newer effect that isn't in either list). See ShopManager's POTION_TIER_CHEAP/PREMIUM
  # sets to move an effect between tiers.
  #
  # Splash and Lingering cost more on top of the base Potion price (splash-multiplier,
  # lingering-multiplier -- roughly mirroring the extra gunpowder/dragon's breath brewing
  # them would otherwise cost), and the "II"/extended-duration variants cost a bit more too
  # (strong-multiplier, long-multiplier). With the defaults below, a plain cheap potion is
  # $15, a premium Lingering II potion tops out well under $250 -- nowhere near
  # pricing-tiers/enchant-books territory, on purpose.
  potions:
    enabled: true
    cheap-base-price: 15
    moderate-base-price: 30
    premium-base-price: 55
    splash-multiplier: 1.6
    lingering-multiplier: 2.5
    strong-multiplier: 1.5
    long-multiplier: 1.25
    bottle-of-enchanting-price: 8
    # Potion types (or "EXPERIENCE_BOTTLE" for the Bottle o' Enchanting) withheld from the
    # Potions tab entirely -- empty by default. Add entries here (e.g. "- LUCK") to remove
    # a specific effect from sale.
    excluded: []

  # The NexusEnchants integration tab -- one max-level tome per custom enchant from the
  # NexusEnchants plugin (184 of them as of v0.11.1), plus Lava Walker / Tide Walker boots
  # and scrolls, all pulled live from that plugin through a soft reflection bridge -- see
  # NexusEnchantsBridge and ShopManager#generateNexusEnchantItems. NexusEnchants must be
  # installed (and enabled before NexusEconomy -- softdepend in plugin.yml already handles
  # that ordering) for this tab to show up at all; if it isn't installed, this whole tab is
  # simply omitted from the shop, same as the NexusSeasons integration degrading gracefully.
  #
  # Pricing is deliberately wild and different for every single enchant, exactly as asked
  # for: base-price * category-multiplier * maxLevel^per-level-exponent * (curse-multiplier
  # if it's a curse) * a per-enchant variance roll between variance-min and variance-max,
  # then rounded to the nearest round-to. category-multipliers spans an 8x range on its own
  # (novelty categories like lead/spyglass vs. universal enchants like Soulbound, which work
  # on literally anything you own), and the variance roll on top of that means no two
  # enchants land on the same price even if their category and max level are identical. With
  # the defaults below, a level-1 curse in a cheap category can land as low as a few thousand,
  # while a max-level universal enchant with a high variance roll can clear seven figures.
  #
  # Regenerated fresh every startup -- never persisted to a file, so retuning any of this
  # takes effect on the next restart.
  nexus-enchants:
    enabled: true
    base-price: 30000
    per-level-exponent: 1.6
    curse-multiplier: 0.4
    variance-min: 0.4
    variance-max: 3.2
    # Rounded to a deliberately non-round number so prices don't look machine-generated --
    # part of making every single one feel like its own weird, specific number.
    round-to: 137
    # Lava Walker Boots / Tide Walker Boots start from this base price (their own narrower
    # 0.70x-1.60x variance roll, see addSpecialWalkerItem in ShopManager); their scroll
    # versions (grants the ability to any boots at an anvil, rather than being the boots
    # themselves) are priced at special-scroll-multiplier of that.
    special-base-price: 500000
    special-scroll-multiplier: 0.35
    # Per-category multiplier -- keyed by NexusEnchants' EnchantCategory names. Any category
    # missing here falls back to ShopManager's own built-in default for that category.
    category-multipliers:
      WEAPON: 3.5
      ARMOR: 3.2
      TOOL: 2.0
      BOW: 3.0
      FISHING_ROD: 1.6
      SHIELD: 2.4
      TRIDENT: 4.0
      SHEARS: 1.2
      ELYTRA: 5.0
      MACE: 4.5
      HORSE_ARMOR: 1.8
      COMPASS: 1.4
      TOTEM: 6.0
      SPYGLASS: 1.1
      CARVED_PUMPKIN: 1.3
      FIREWORK_ROCKET: 1.5
      LEAD: 1.0
      CROSSBOW: 3.0
      # Applies to any item at all (e.g. Soulbound) -- the single most valuable category, by design.
      UNIVERSAL: 8.0

  # The NexusAccessories integration -- an "Accessories" tab selling every Ring/Belt/Cape/Charm
  # that plugin knows about (pulled live through NexusAccessoriesBridge), plus a separate
  # "Accessory Slots" button for buying extra slot capacity per type (that purchase flow's cost
  # formula actually lives in NexusAccessories' own config, since it owns that state -- see its
  # accessories.slot-prices; NexusEconomy just queries the cost and charges for it, see
  # AccessorySlotsMenuListener). NexusAccessories must be installed for either to appear at all.
  #
  # Accessories are permanent, stacking power upgrades -- the same league as enchant tomes, not
  # everyday sellable blocks -- so they get their own price scale rather than reusing the plain
  # shop.pricing-tiers table: base-price * tier-multiplier * a per-accessory variance roll,
  # rounded to round-to. With the defaults below, a Scrap accessory lands in the tens of
  # thousands and a Mythic one clears a million or two depending on its variance roll.
  accessories:
    enabled: true
    base-price: 50000
    variance-min: 0.6
    variance-max: 1.6
    round-to: 111
    tier-multipliers:
      SCRAP: 1.0
      COMMON: 2.0
      STANDARD: 4.0
      REFINED: 8.0
      PRECIOUS: 16.0
      EXOTIC: 32.0
      MYTHIC: 64.0

  # The Hearts / Hunger / Oxygen tabs -- three permanent, per-player progression
  # tracks, each bought level by level straight out of the shop (see the "Hearts",
  # "Hunger", and "Oxygen" buttons on the main /shop category screen). Each cost
  # compounds by its own growth-percent per level already owned (cost for the next
  # level = base-price * (1 + growth-percent/100) ^ current-level), same shape as the
  # enchant-book formula above, rounded to the nearest $50.
  #
  # Hearts genuinely raises the vanilla max-health cap via a real attribute modifier
  # -- Minecraft's own HUD wraps extra hearts into more rows past the normal 10
  # automatically, so this needs no client-side trickery. Hunger and Oxygen can't do
  # the same thing -- both bars are hard-capped by the client with no vanilla overflow
  # rendering the way health has -- so instead each level rolls a chance to silently
  # keep the bar where it is instead of letting it tick down, making the bar you
  # already have drain slower the more levels you own. See VitalsManager/VitalsListener.
  vitals:
    hearts:
      enabled: true
      # 15 levels * 2 HP (1 heart) each = +30 HP / +15 hearts at max level, on top of
      # the vanilla 20 HP / 10 hearts -- 50 HP / 25 hearts total, maxed out.
      max-level: 15
      hp-per-level: 2.0
      base-price: 8000
      growth-percent: 25.0
    hunger:
      enabled: true
      # 10 levels * 9% each = 90% of hunger-drain ticks silently skipped at max level
      # -- your food bar empties roughly ten times slower, not literally never.
      max-level: 10
      reduction-per-level-percent: 9.0
      base-price: 5000
      growth-percent: 30.0
    oxygen:
      enabled: true
      # 10 levels * +0.2x each = a 3x longer-lasting air supply at max level (1.0x ->
      # 3.0x duration multiplier), converted internally into the same kind of
      # skip-the-next-drain-tick roll hunger uses.
      max-level: 10
      duration-multiplier-per-level: 0.2
      base-price: 5000
      growth-percent: 30.0

auction:
  # server-generated auctions on top of whatever players list themselves
  auto-enabled: true
  # how often (minutes) a new automatic server auction appears
  auto-interval-minutes: 30
  # how long (minutes) each auction runs once listed, both server and player
  duration-minutes: 60
  # pool the server picks randomly from for its own auctions -- fully yours
  # to edit; add/remove/reprice entries freely
  pool:
    - material: DIAMOND
      amount: 1
      start-price: 15.0
    - material: EMERALD
      amount: 4
      start-price: 20.0
    - material: NETHERITE_INGOT
      amount: 1
      start-price: 120.0
    - material: GOLDEN_APPLE
      amount: 2
      start-price: 15.0
    - material: ENDER_PEARL
      amount: 8
      start-price: 12.0

credit:
  # a new player's starting credit line and score
  starting-limit: 500.0
  starting-score: 650
  min-score: 300
  max-score: 850
  # applied to whatever's left unpaid at the end of each billing cycle
  monthly-interest-rate: 0.02
  # minimum payment due each cycle: the larger of (balance * percent) and the floor
  minimum-payment-percent: 0.03
  minimum-payment-floor: 10.0
  # charged on top of the balance if last cycle's minimum wasn't paid
  late-fee: 25.0
  score-penalty-per-missed-payment: 30
  score-bonus-per-ontime-payment: 5
  # consecutive missed cycles before the account freezes (charging blocked until paid down)
  freeze-after-missed-payments: 3
  # billing is driven directly by NexusSeasons' day counter when it's installed --
  # the instant the day rolls from its max (30 by default) back to 1, that's a new
  # month and a billing cycle runs. If NexusSeasons isn't installed, this real-time
  # interval is used instead so credit still works standalone.
  fallback-billing-interval-hours: 168

  # A periodic chat reminder telling players how to get a physical credit card.
  # interval-minutes only takes effect on (re)start -- toggling enabled off and
  # running /nexuseconomyadmin reload (or restarting) stops it firing again, but
  # changing the interval itself needs a restart since the repeating task is
  # scheduled once at startup with whatever interval was configured then.
  # & is a color code prefix (translated the same way as most Bukkit chat config).
  announcement:
    enabled: true
    interval-minutes: 20
    message: "&b&lNeed cash on hand? &fRun &e/credit give &fto get a credit card, then &e/credit charge <amount> &fany time."

bank:
  # savings interest, paid on the SAME billing cycle as credit (one season
  # change, or the real-time fallback if NexusSeasons isn't installed)
  interest-enabled: true
  interest-rate: 0.01
  # balances below this don't earn interest -- avoids meaningless fraction-of-a-cent payouts
  interest-minimum-balance: 1.0
  # preset one-click withdraw amounts shown in the /bank GUI -- /bank withdraw <amount>
  # still works for any exact whole-dollar amount not listed here
  withdraw-presets: [10, 50, 100, 500, 1000]

stocks:
  enabled: true
  # how often prices move
  tick-interval-minutes: 5
  # default per-tick random-walk range (+/-) for any stock that doesn't set its own
  default-volatility: 0.03
  # rare chance EVERY tick check of a market-wide event instead of normal movement
  event-chance: 0.05
  crash-min-percent: 10
  crash-max-percent: 30
  boom-min-percent: 10
  boom-max-percent: 30

  # the roster -- add/remove/reprice freely, this is a starter set tying into
  # the rest of the server's own lore/economy
  roster:
    nexind:
      company-name: "NexusIndustries Corp"
      starting-price: 100.0
      volatility: 0.02
      min-price: 20.0
      max-price: 500.0
    safehaven:
      company-name: "SafeHaven Trust"
      starting-price: 50.0
      volatility: 0.01
      min-price: 20.0
      max-price: 100.0
    voltex:
      company-name: "Voltex Energy"
      starting-price: 45.0
      volatility: 0.04
      min-price: 5.0
      max-price: 200.0
    cryptidco:
      company-name: "CryptidCo Expeditions"
      starting-price: 30.0
      volatility: 0.08
      min-price: 2.0
      max-price: 300.0
    blackmarket_h:
      company-name: "Black Market Holdings"
      starting-price: 20.0
      volatility: 0.12
      min-price: 1.0
      max-price: 400.0
    frontier:
      company-name: "Frontier Mining Co"
      starting-price: 60.0
      volatility: 0.05
      min-price: 10.0
      max-price: 250.0

# /tpa <player>: request-to-teleport, paid. The target has to /tpaccept or
# /tpdeny it -- nothing happens automatically. Accepting charges the
# REQUESTER (the one being moved), never the target, straight out of
# their NexusEconomy balance; if they can't afford it, the request is
# cancelled and nobody moves.
teleport:
  enabled: true
  # flat price for a single teleport with a clean recent history (no other
  # teleports in the window below)
  base-cost: 10.0
  # how long (real seconds) a sent request stays open before it auto-expires
  request-expiry-seconds: 60
  # if true, the fee is paid TO the target instead of just leaving the
  # economy -- lets someone charge others to "summon" them. false = the
  # fee is a straight sink, same as a shop buy price.
  pay-to-target: false

  escalation:
    # rolling window: only teleports the requester made within this many
    # minutes of right now count toward their price. One older than the
    # window ages out on its own -- no separate cooldown to reset.
    window-minutes: 10
    # each teleport already made inside the window raises the price of the
    # NEXT one by this percent over the last. cost = base-cost *
    # (1 + growth-percent/100) ^ (teleports already made in the window).
    # The default below (35%) lands roughly at the low double digits for a
    # first teleport, climbing to about $150 by a 10th teleport inside one
    # 10-minute window ($10 -> 13.50 -> 18.23 -> ... -> ~149 on the 10th).
    growth-percent: 35.0
    # hard ceiling on any single teleport's price, however escalated -- 0
    # (or negative) disables the cap entirely.
    max-cost: 500.0

  # Players with the nexuseconomy.tpa.bypass permission (OP by default --
  # see plugin.yml) skip the whole request/accept flow: /tpa teleports
  # them in immediately, no /tpaccept needed on the other end. Free by
  # default; flip charge-enabled on if you want them to still pay
  # something (a flat amount, NOT the escalating price above, and it
  # doesn't count toward a regular player's escalation history).
  bypass:
    charge-enabled: false
    cost: 50.0
